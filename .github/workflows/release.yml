name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release notes
    runs-on: windows-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create or update GitHub release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notesPath = ".github/release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
            $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
            $generatedNotes = gh api `
              --method POST `
              "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
              -f "tag_name=$env:GITHUB_REF_NAME" `
              --jq ".body"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            Set-Content -LiteralPath $notesPath -Value $generatedNotes -Encoding utf8NoBOM
          }

          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:GITHUB_REF_NAME `
              --repo $env:GITHUB_REPOSITORY `
              --title "Grox $env:GITHUB_REF_NAME" `
              --notes-file $notesPath
          } else {
            gh release create $env:GITHUB_REF_NAME `
              --repo $env:GITHUB_REPOSITORY `
              --title "Grox $env:GITHUB_REF_NAME" `
              --notes-file $notesPath `
              --verify-tag
          }

  build:
    name: Build ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
            rustTarget: x86_64-pc-windows-msvc
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            rustTarget: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rustTarget: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rustTarget: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Cache Rust builds
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Synchronize app version from tag
        working-directory: apps/desktop
        run: node scripts/sync-release-version.mjs ${{ github.ref_name }}

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Grox ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows portable archive
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $binary = "apps/desktop/src-tauri/target/release/grox-desktop.exe"
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Portable binary not found: $binary"
          }
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $staging = Join-Path $env:RUNNER_TEMP "Grox-portable"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $staging "Grox.exe")
          Copy-Item -LiteralPath "LICENSE" -Destination $staging
          Copy-Item -LiteralPath "THIRD-PARTY-NOTICES" -Destination $staging
          $archive = Join-Path $env:RUNNER_TEMP "Grox_${version}_windows_x64_portable.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $archive -Force
          gh release upload $env:GITHUB_REF_NAME $archive --clobber

  finalize-release:
    name: Publish checksums
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 -I{} sh -c 'sha256sum "release-assets/$1"' _ {} \
            | sed 's#release-assets/##' > SHA256SUMS
          test -s SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
