name: Check official Grok Build updates

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Test the upstream tracker
        run: node --test scripts/upstream-tracker.test.mjs

      - name: Track every change until verified integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/upstream-tracker.mjs
