name: Check official Grok Build updates

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-grok-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test the upstream tracker
        run: node --test scripts/upstream-tracker.test.mjs

      - name: Track official releases until verified integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/upstream-tracker.mjs
